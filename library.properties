sentence=Library for the SIMCom SIM7080G LTE CAT-M / NB-IoT modem with MQTT and GNSS support
paragraph=Easy-to-use interface for ESP32 to drive the SIMCom SIM7080G. Features include AT command management with URC handling, CAT-M/NB-IoT network setup with automatic failover between modes and automatic APN (CNMP/CMNB/CBANDCFG/CEREG/CGNAPN/CNCFG/CNACT), connection supervisor with MQTT auto-reconnect, NTP synchronization, MQTT and MQTTS client over AT+SM* commands, certificate upload and GNSS positioning (CGNSPWR/CGNSINF).
category=Communication
